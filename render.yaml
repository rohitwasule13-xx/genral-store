databases:
  - name: generalstore-db
    plan: free

services:
  - type: web
    name: generalstore
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn GeneralStore.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: generalstore-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
